<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Clicker Arcade</title>
    <style>
        /* Retro Arcade Styling */
        body {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background-color: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #f43f5e;
            text-shadow: 2px 2px #000;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 1.8rem;
            margin: 20px 0;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 1px 1px #000;
        }

        /* The Big Game Button */
        .click-btn {
            background-color: #4ade80;
            color: #0f172a;
            border: 4px solid #22c55e;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px #16a34a, 0 12px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            outline: none;
        }

        .click-btn:active {
            box-shadow: 0 2px #16a34a, 0 4px 10px rgba(0,0,0,0.5);
            transform: translateY(6px);
        }

        .shop-box {
            margin-top: 30px;
            border-top: 2px dashed #38bdf8;
            padding-top: 20px;
        }

        .upgrade-btn {
            background-color: #e2e8f0;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upgrade-btn:hover {
            background-color: #38bdf8;
            color: #fff;
        }

        .upgrade-btn:disabled {
            background-color: #64748b;
            color: #94a3b8;
            cursor: not-allowed;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>PIXEL CLICKER</h1>
        <p>Click the energy orb to harvest pixels!</p>
        
        <div class="score-display">Pixels: <span id="score">0</span></div>
        
        <button class="click-btn" id="clicker">TAP!</button>
        
        <div class="shop-box">
            <h3>Arcade Shop</h3>
            <button class="upgrade-btn" id="upgrade-btn" disabled>
                Buy Super Clicker (Cost: 10 Pixels)
            </button>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px;">
                Super Clicker gives you +2 pixels per tap!
            </p>
        </div>
    </div>

    <footer>Powered by Git, GitHub & ChatGPT</footer>

    <script>
        // Game Logic Variables
        let score = 0;
        let pixelsPerClick = 1;
        let upgradeCost = 10;

        // Get HTML Elements
        const scoreDisplay = document.getElementById('score');
        const clickerBtn = document.getElementById('clicker');
        const upgradeBtn = document.getElementById('upgrade-btn');

        // Click Logic
        clickerBtn.addEventListener('click', () => {
            score += pixelsPerClick;
            updateDisplay();
        });

        // Upgrade Shop Logic
        upgradeBtn.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                pixelsPerClick += 2;
                upgradeCost = Math.round(upgradeCost * 1.8); // Make next upgrade more expensive
                updateDisplay();
            }
        });

        // Update values on screen
        function updateDisplay() {
            scoreDisplay.textContent = score;
            
            // Check if user can afford the upgrade
            if (score >= upgradeCost) {
                upgradeBtn.disabled = false;
                upgradeBtn.style.backgroundColor = '#fbbf24'; // Turn golden yellow when affordable
            } else {
                upgradeBtn.disabled = true;
                upgradeBtn.style.backgroundColor = '#e2e8f0';
            }
            
            upgradeBtn.textContent = `Buy Super Clicker (Cost: ${upgradeCost} Pixels)`;
        }
    </script>
</body>
</html>
